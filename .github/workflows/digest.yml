name: Email digest

# Once a day, asks the send-digest Edge Function to email everyone a summary of the
# notifications they haven't read yet (sent through Brevo). Does nothing until the
# DIGEST_SECRET repository secret is set — see docs/EMAIL.md.
on:
  schedule:
    - cron: '23 7 * * *' # 07:23 UTC = 08:23 Lisbon summer time
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Count recipients without sending'
        type: boolean
        default: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Call send-digest
        env:
          DIGEST_SECRET: ${{ secrets.DIGEST_SECRET }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: |
          if [ -z "$DIGEST_SECRET" ]; then
            echo "DIGEST_SECRET is not set; skipping (see docs/EMAIL.md)."
            exit 0
          fi
          set -a; . ./.env; set +a
          url="$VITE_SUPABASE_URL/functions/v1/send-digest"
          [ "$DRY_RUN" = "1" ] && url="$url?dry=1"
          status=$(curl -sS -o response.json -w '%{http_code}' -X POST "$url" \
            -H "x-digest-secret: $DIGEST_SECRET" -H 'Content-Type: application/json' -d '{}')
          echo "send-digest responded with HTTP $status"
          cat response.json; echo
          test "$status" = "200"
