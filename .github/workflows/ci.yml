name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The app needs a Supabase URL and anon key to load (src/lib/supabase.js); .env isn't committed.
    env:
      VITE_SUPABASE_URL: ${{ vars.TEST_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.TEST_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The app needs a Supabase URL and anon key to load (src/lib/supabase.js); .env isn't committed.
    env:
      VITE_SUPABASE_URL: ${{ vars.TEST_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.TEST_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Browser only, no apt: the runner image already has the libraries Chromium needs, and
      # apt-get against the Ubuntu mirrors made both e2e jobs fail before any test ran.
      - run: npx playwright install chromium
      - run: npm run build
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  # Signed-in smoke tests against the Supabase TEST project. Off until the repository
  # variable E2E_AUTH_ENABLED is 'true' and TEST_SUPABASE_URL / TEST_SUPABASE_ANON_KEY
  # are set (Settings → Secrets and variables → Actions → Variables). See docs/TESTING.md.
  e2e-auth:
    if: vars.E2E_AUTH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # One queue per PR (or branch): a newer push replaces that PR's older run, and different PRs
    # run side by side. Each run creates and sweeps only its own tagged accounts (E2E_RUN), so
    # runs don't share data. A single repo-wide group held just one waiting run, so parallel
    # PRs kept cancelling each other's pending runs.
    concurrency:
      group: e2e-auth-${{ github.ref }}
      cancel-in-progress: true
    env:
      E2E_AUTH: '1'
      # Tags every account this run creates, so the sweep below deletes only those
      E2E_RUN: gh${{ github.run_id }}-${{ github.run_attempt }}
      VITE_SUPABASE_URL: ${{ vars.TEST_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.TEST_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Browser only, no apt: the runner image already has the libraries Chromium needs, and
      # apt-get against the Ubuntu mirrors made both e2e jobs fail before any test ran.
      - run: npx playwright install chromium
      - name: Refuse to run against production
        run: |
          case "$VITE_SUPABASE_URL" in
            ""|*otmulrlslecgyezpcqxy*) echo "TEST_SUPABASE_URL must point at the test project"; exit 1 ;;
          esac
      - run: npm run build
      # Pull requests run the smoke set only (tests tagged @smoke: the journey, the import and
      # sign-in checks, and one path per area). Everything runs every night (e2e-nightly.yml).
      - run: npm run test:e2e -- --grep @smoke
      # Runs even when a test failed: deletes the test accounts this run created, and only those
      - name: Sweep this run's test accounts
        if: always()
        run: node scripts/e2e-sweep.mjs "$E2E_RUN"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces-auth
          path: test-results/
          retention-days: 7
