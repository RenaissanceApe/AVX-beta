name: Database backup

# Daily encrypted dump of the Supabase database (the free plan has no downloadable backups).
# The repository is public, so the dump is encrypted before it is stored as a workflow
# artifact. Restore instructions: docs/BACKUPS.md
#
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_DB_URL     Session pooler connection string (Supabase → Connect → Session pooler)
#   BACKUP_PASSPHRASE   Long random passphrase — store it in your password manager too
on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - name: Check configuration
        id: config
        run: |
          if [ -z "$SUPABASE_DB_URL" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::warning::Backups are not configured (SUPABASE_DB_URL / BACKUP_PASSPHRASE secrets missing) — skipping."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install PostgreSQL 17 client
        if: steps.config.outputs.enabled == 'true'
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-17

      - name: Dump and encrypt
        if: steps.config.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          name="avx-db-$(date -u +%Y-%m-%dT%H%M)"
          /usr/lib/postgresql/17/bin/pg_dump "$SUPABASE_DB_URL" \
            --schema=public --schema=private --schema=auth --schema=storage \
            --no-owner --no-privileges --format=custom --file="$name.dump"
          gpg --batch --yes --symmetric --cipher-algo AES256 --passphrase "$BACKUP_PASSPHRASE" \
            --output "$name.dump.gpg" "$name.dump"
          rm "$name.dump"
          echo "BACKUP_FILE=$name.dump.gpg" >> "$GITHUB_ENV"
          ls -lh "$name.dump.gpg"

      - name: Store encrypted backup
        if: steps.config.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BACKUP_FILE }}
          path: ${{ env.BACKUP_FILE }}
          retention-days: 30
          if-no-files-found: error
