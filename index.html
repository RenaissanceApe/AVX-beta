<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#080C14" />
    <meta name="description" content="AVX — the AV production copilot. Gigs, crew, documents and updates in one place." />
    <!-- Private beta: keep out of search engines -->
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AVX" />
    <title>AVX — AV Production Copilot</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body, #root { height: 100%; }
      body { background: #080C14; color: #fff; font-family: 'DM Sans', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
      /* Installed on an iPhone (home screen), the app is drawn under the status bar (clock, battery)
         and, sideways, beside the notch. Keep everything clear of them; a strip in the app's colour
         sits behind the status bar so nothing scrolls under the clock. Elsewhere these are 0. */
      :root { --safe-top: env(safe-area-inset-top, 0px); --safe-left: env(safe-area-inset-left, 0px); --safe-right: env(safe-area-inset-right, 0px); }
      body { padding: var(--safe-top) var(--safe-right) 0 var(--safe-left); }
      body::before { content: ''; position: fixed; top: 0; left: 0; right: 0; height: var(--safe-top); background: #080C14; z-index: 1000; pointer-events: none; }
      input, textarea, select, button { font-family: inherit; }
      button:disabled { opacity: 0.5; cursor: not-allowed; }
      /* Inputs at 16px+ stop iOS Safari from zooming in on focus */
      @media (max-width: 640px) { input, textarea, select { font-size: 16px !important; } }
      /* iOS Safari gives date/time inputs a fixed minimum width and no height when empty:
         let them shrink to their column and keep a normal height */
      input[type="date"], input[type="time"], input[type="datetime-local"] { min-width: 0; min-height: 42px; -webkit-appearance: none; appearance: none; }
      input::-webkit-date-and-time-value { text-align: left; }
      :focus-visible { outline: 2px solid #1EC878; outline-offset: 2px; }
      @keyframes spin { to { transform: rotate(360deg) } }
      @keyframes fadeIn { from { opacity: 0; transform: translateY(6px) } to { opacity: 1; transform: translateY(0) } }
      @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; } }
    </style>
  </head>
  <body>
    <noscript>AVX needs JavaScript enabled.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
