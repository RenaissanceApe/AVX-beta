<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#00080E" />
    <meta name="description" content="AVX — the AV production copilot. Gigs, crew, documents and updates in one place." />
    <!-- Private beta: keep out of search engines -->
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AVX" />
    <title>AVX — AV Production Copilot</title>
    <script>
      // Appearance before the first paint (src/lib/appearance.js does the same once the app loads)
      try {
        var a = JSON.parse(localStorage.getItem('avx.appearance') || '{}'), r = document.documentElement
        var light = window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches
        r.dataset.theme = a.theme === 'system' ? (light ? 'light' : 'dark') : (a.theme === 'light' || a.theme === 'contrast' ? a.theme : 'dark')
        r.dataset.size = a.size === 'large' || a.size === 'xlarge' ? a.size : 'normal'
        if (a.font === 'readable') r.dataset.font = 'readable'
        if (a.comfort === true) r.dataset.comfort = ''
      } catch (e) { document.documentElement.dataset.theme = 'dark' }
    </script>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body, #root { height: 100%; }
      /* Colours come from the theme (src/theme/tokens.js); the fallbacks are the dark theme */
      :root { --font-ui: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, sans-serif; --font-mono: 'Space Mono', ui-monospace, monospace; }
      :root[data-font="readable"] { --font-ui: 'Atkinson Hyperlegible', system-ui, sans-serif; --font-mono: 'Atkinson Hyperlegible', ui-monospace, monospace; }
      html { background: var(--bg, #021829); }
      body { background: var(--bg, #021829); color: var(--text, #F0F1F3); font-family: var(--font-ui); -webkit-font-smoothing: antialiased; }
      /* Text size: the whole layout grows with it, separate from the browser's zoom */
      :root[data-size="large"] body { zoom: 1.15; }
      :root[data-size="xlarge"] body { zoom: 1.3; }
      /* Comfortable mode: everything you tap is at least 44 px */
      :root[data-comfort] :is(button, select, a[role="button"], input:not([type="checkbox"]):not([type="radio"])) { min-height: 44px; }
      :root[data-comfort] button { min-width: 44px; }
      :root[data-comfort] :is(input[type="checkbox"], input[type="radio"]) { width: 22px; height: 22px; }
      /* Installed on an iPhone (home screen), the app is drawn under the status bar (clock, battery)
         and, sideways, beside the notch. Keep everything clear of them; a strip in the app's colour
         sits behind the status bar so nothing scrolls under the clock. Elsewhere these are 0. */
      :root { --safe-top: env(safe-area-inset-top, 0px); --safe-left: env(safe-area-inset-left, 0px); --safe-right: env(safe-area-inset-right, 0px); }
      body { padding: var(--safe-top) var(--safe-right) 0 var(--safe-left); }
      body::before { content: ''; position: fixed; top: 0; left: 0; right: 0; height: var(--safe-top); background: var(--chrome, #00101C); z-index: 1000; pointer-events: none; }
      input, textarea, select, button { font-family: inherit; }
      /* Space Mono names things and holds the numbers (titles, table heads, times, codes); Inter explains */
      h1, h2, h3, th, time, .mono { font-family: var(--font-mono); }
      h1, h2, h3 { font-weight: 700; }
      th { font-weight: 700; }
      /* L&P brand system: every corner is square (Brand Book v1.2 §11, DESIGN.md). One rule, so inline radii can't creep back. */
      *, *::before, *::after { border-radius: 0 !important; }
      /* Loading is a blinking square (status dots) or the AVX Pixel Build below, never a spinner */
      @keyframes blink { 50% { opacity: 0 } }
      /* Loading: the AVX glyph's Pixel Build (Brand Book §09; <AvxLoader> in components/ui.jsx). One cell every 50 ms in
         reading order, whole at 600 ms, clear at 1400 ms, 1.6 s loop. Reduced motion and Comfort mode: the still mark. */
      @keyframes avxBuild0 { 0% { opacity: 0 } 3.125% { opacity: 1 } 87.5% { opacity: 0 } }
      .avx-loader rect:nth-child(1) { animation: avxBuild0 1.6s step-end infinite; }
      @keyframes avxBuild1 { 0% { opacity: 0 } 6.25% { opacity: 1 } 87.5% { opacity: 0 } }
      .avx-loader rect:nth-child(2) { animation: avxBuild1 1.6s step-end infinite; }
      @keyframes avxBuild2 { 0% { opacity: 0 } 9.375% { opacity: 1 } 87.5% { opacity: 0 } }
      .avx-loader rect:nth-child(3) { animation: avxBuild2 1.6s step-end infinite; }
      @keyframes avxBuild3 { 0% { opacity: 0 } 12.5% { opacity: 1 } 87.5% { opacity: 0 } }
      .avx-loader rect:nth-child(4) { animation: avxBuild3 1.6s step-end infinite; }
      @keyframes avxBuild4 { 0% { opacity: 0 } 15.625% { opacity: 1 } 87.5% { opacity: 0 } }
      .avx-loader rect:nth-child(5) { animation: avxBuild4 1.6s step-end infinite; }
      @keyframes avxBuild5 { 0% { opacity: 0 } 18.75% { opacity: 1 } 87.5% { opacity: 0 } }
      .avx-loader rect:nth-child(6) { animation: avxBuild5 1.6s step-end infinite; }
      @keyframes avxBuild6 { 0% { opacity: 0 } 21.875% { opacity: 1 } 87.5% { opacity: 0 } }
      .avx-loader rect:nth-child(7) { animation: avxBuild6 1.6s step-end infinite; }
      @keyframes avxBuild7 { 0% { opacity: 0 } 25% { opacity: 1 } 87.5% { opacity: 0 } }
      .avx-loader rect:nth-child(8) { animation: avxBuild7 1.6s step-end infinite; }
      @keyframes avxBuild8 { 0% { opacity: 0 } 28.125% { opacity: 1 } 87.5% { opacity: 0 } }
      .avx-loader rect:nth-child(9) { animation: avxBuild8 1.6s step-end infinite; }
      @keyframes avxBuild9 { 0% { opacity: 0 } 31.25% { opacity: 1 } 87.5% { opacity: 0 } }
      .avx-loader rect:nth-child(10) { animation: avxBuild9 1.6s step-end infinite; }
      @keyframes avxBuild10 { 0% { opacity: 0 } 34.375% { opacity: 1 } 87.5% { opacity: 0 } }
      .avx-loader rect:nth-child(11) { animation: avxBuild10 1.6s step-end infinite; }
      @media (prefers-reduced-motion: reduce) { .avx-loader rect { animation: none !important; } }
      :root[data-comfort] .avx-loader rect { animation: none; }
      button:disabled { opacity: 0.5; cursor: not-allowed; }
      /* Inputs at 16px+ stop iOS Safari from zooming in on focus */
      @media (max-width: 640px) { input, textarea, select { font-size: 16px !important; } }
      /* iOS Safari gives date/time inputs a fixed minimum width and no height when empty:
         let them shrink to their column and keep a normal height */
      input[type="date"], input[type="time"], input[type="datetime-local"] { min-width: 0; min-height: 42px; -webkit-appearance: none; appearance: none; }
      input::-webkit-date-and-time-value { text-align: left; }
      :focus-visible { outline: 2px solid var(--focus, #33FB31); outline-offset: 2px; }
      :root[data-theme="contrast"] :focus-visible { outline-width: 3px; }
      /* Text fields always show the ring while focused (inline styles turn the default outline off) */
      :is(input, textarea, select):focus { outline: 2px solid var(--focus, #33FB31) !important; outline-offset: 0; }
      .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
      @keyframes fadeIn { from { opacity: 0; transform: translateY(10px) } to { opacity: 1; transform: translateY(0) } }
      @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; } }
    </style>
  </head>
  <body>
    <noscript>AVX needs JavaScript enabled.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
